<style>
  :root {
    --bg:        #f5f3ef;
    --white:     #ffffff;
    --charcoal:  #1b1b1b;
    --sage:      #5a7a54;
    --sage-lt:   #8aab84;
    --sage-pale: #e8f0e5;
    --rust:      #c46044;
    --sand:      #e8e0d4;
    --border:    #ddd8d0;
    --grey:      #7a756e;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans:  'DM Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px 30px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(27,27,27,0.06);
  }
  .card-logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--charcoal);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 20px;
  }
  .card-logo { height: 64px; display: block; }
  .card h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 6px;
  }
  .card-sub {
    color: var(--grey);
    font-size: 14.5px;
    margin: 0 0 26px;
  }
  select.lang-select {
    position: absolute;
    top: 18px;
    right: 18px;
    border: 1.5px solid var(--border);
    background: var(--white);
    border-radius: 8px;
    padding: 5px 8px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--charcoal);
  }
  .card-wrap { position: relative; width: 100%; max-width: 420px; }
  .links { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--charcoal);
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .link-row:hover { border-color: var(--sage); background: var(--sage-pale); transform: translateY(-1px); }
  .link-icon {
    width: 40px; height: 40px; flex: none;
    border-radius: 10px;
    background: var(--sage-pale);
    color: var(--sage);
    display: flex; align-items: center; justify-content: center;
  }
  .link-icon svg { width: 20px; height: 20px; }
  .link-text-label { font-size: 12.5px; color: var(--grey); }
  .link-text-val { font-size: 15px; font-weight: 500; }
  .card-footer {
    margin-top: 26px;
    font-size: 12.5px;
    color: var(--grey);
  }
</style>
</head>
